{% extends 'DRM_App/base.html' %}

{% block title %}Update User Role — DRM Guard{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card card-custom p-4">
            <h3 class="fw-bold text-white mb-2">Update User Role</h3>
            <p class="text-muted small mb-4">Modify security clearance role for <strong class="text-white">{{ target_user.username }}</strong>.</p>

            <form method="POST">
                {% csrf_token %}
                <div class="mb-4">
                    <label class="form-label text-muted small fw-bold">Select Role *</label>
                    {{ form.role }}
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary-custom px-4">Save Changes</button>
                    <a href="{% url 'user_manage' %}" class="btn btn-outline-secondary px-4">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
