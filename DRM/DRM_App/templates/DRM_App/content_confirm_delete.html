{% extends 'DRM_App/base.html' %}

{% block title %}Confirm Delete — DRM Guard{% endblock %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-md-6">
        <div class="card card-custom p-4 border-danger border-opacity-50 text-center">
            <i class="bi bi-exclamation-triangle-fill text-danger fs-1 mb-3"></i>
            <h4 class="fw-bold text-white mb-2">Confirm Delete</h4>
            <p class="text-light mb-4">Are you sure you want to permanently delete digital asset <strong>"{{ content.title }}"</strong>?</p>
            <form method="POST">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-3">
                    <a href="{% url 'content_manage' %}" class="btn btn-outline-secondary px-4">Cancel</a>
                    <button type="submit" class="btn btn-danger px-4">Delete Permanently</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
